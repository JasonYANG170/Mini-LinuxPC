name: Build Mini-LinuxPC

on:
  push:
    branches: [ v1.0, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ v1.0, main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - kernel
          - uboot
          - rootfs

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 480
    permissions:
      contents: write
      packages: write
    
    steps:
    - name: Maximize build space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        df -h
    
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1
    
    - name: Set up build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          wget \
          curl \
          bc \
          bison \
          flex \
          libssl-dev \
          libncurses-dev \
          device-tree-compiler \
          u-boot-tools \
          python3 \
          python3-pip \
          cpio \
          rsync \
          unzip \
          gawk \
          mtd-utils \
          liblz4-tool \
          libgmp-dev \
          libmpc-dev \
          libmpfr-dev \
          texinfo \
          dosfstools \
          mtools \
          zip \
          p7zip-full
    
    - name: Configure git
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
    
    - name: Cache build output
      uses: actions/cache@v4
      with:
        path: |
          output
          sysdrv/source/buildroot/buildroot-*/dl
        key: ${{ runner.os }}-build-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-build-
    
    - name: Build with lunch option 001
      run: |
        chmod +x build.sh
        # Hardware: 0 (RV1103_Luckfox_Pico)
        # Boot Medium: 0 (SD_CARD)
        # System: 1 (Ubuntu)
        echo -e "0\n0\n1" | ./build.sh lunch
        
    - name: Build all
      if: github.event.inputs.build_type == 'all' || github.event.inputs.build_type == ''
      run: |
        sudo ./build.sh all
    
    - name: Build kernel only
      if: github.event.inputs.build_type == 'kernel'
      run: |
        ./build.sh kernel
    
    - name: Build uboot only
      if: github.event.inputs.build_type == 'uboot'
      run: |
        ./build.sh uboot
    
    - name: Build rootfs only
      if: github.event.inputs.build_type == 'rootfs'
      run: |
        sudo ./build.sh rootfs
    
    - name: Prepare artifacts
      if: success()
      run: |
        mkdir -p artifacts
        if [ -d "output/image" ]; then
          cp -r output/image/* artifacts/ || true
        fi
        if [ -d "IMAGE" ]; then
          find IMAGE -name "*.img" -o -name "*.bin" -o -name "build_info.txt" | \
            xargs -I {} cp --parents {} artifacts/ || true
        fi
        ls -lah artifacts/
        
    - name: Create release package
      if: success()
      run: |
        cd artifacts
        DATE=$(date +%Y%m%d_%H%M)
        zip -r ../Mini-LinuxPC-RV1103-Ubuntu-${DATE}.zip .
        cd ..
        ls -lh Mini-LinuxPC-*.zip
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: mini-linuxpc-images-${{ github.sha }}
        path: |
          artifacts/
          Mini-LinuxPC-*.zip
        retention-days: 30
        if-no-files-found: warn
    
    - name: Upload release package
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: Mini-LinuxPC-Release-Package
        path: Mini-LinuxPC-*.zip
        retention-days: 90
        if-no-files-found: warn
    
    - name: Create or update latest release
      if: success() && github.ref == 'refs/heads/v1.0'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: latest
        name: Latest Build (Auto-generated)
        files: |
          Mini-LinuxPC-*.zip
          artifacts/boot.img
          artifacts/env.img
          artifacts/idblock.img
          artifacts/oem.img
          artifacts/rootfs.img
          artifacts/uboot.img
          artifacts/update.img
          artifacts/userdata.img
        draft: false
        prerelease: true
        body: |
          ## Mini-LinuxPC Latest Build
          
          **⚠️ This is an automated build from the latest commit**
          
          ### Build Information
          - Commit: ${{ github.sha }}
          - Branch: ${{ github.ref_name }}
          - Build Date: ${{ github.event.head_commit.timestamp }}
          
          ### Hardware Configuration
          - Board: RV1103_Luckfox_Pico
          - Boot Medium: SD_CARD
          - System: Ubuntu
          
          ### Files
          - `Mini-LinuxPC-*.zip`: Complete image package (recommended)
          - `update.img`: Firmware update image (for USB/SD card flashing)
          - Individual partition images for advanced users
          
          ### Flash Instructions
          1. Download `Mini-LinuxPC-*.zip` or `update.img`
          2. Extract the zip (if downloaded zip)
          3. Use SD card or USB to flash the device
          
          For detailed instructions, see the README.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Create release on tag
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          Mini-LinuxPC-*.zip
          artifacts/*.img
          artifacts/*.bin
          artifacts/**/build_info.txt
        draft: false
        prerelease: false
        body: |
          ## Mini-LinuxPC Release
          
          ### Hardware Configuration
          - Board: RV1103_Luckfox_Pico
          - Boot Medium: SD_CARD
          - System: Ubuntu
          
          ### Files
          - `Mini-LinuxPC-*.zip`: Complete image package (recommended)
          - Individual image files for advanced users
          
          ### Flash Instructions
          1. Download the zip package
          2. Extract the files
          3. Use `update.img` to flash via USB or SD card
          
          For detailed instructions, see the README.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
